<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioChange - מטלת ביניים בקורס ניהול תהליכים תפעוליים</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #525659;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .pdf-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: white;
      text-align: center;
      padding: 20px;
      gap: 16px;
    }
    .fallback a {
      background: #5c16c5;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <iframe src="document.pdf#toolbar=1&navpanes=1&statusbar=1&view=FitH" type="application/pdf">
      <div class="fallback">
        <h2>מסמך מטלת ביניים - BioChange LTD</h2>
        <p>אם המסמך אינו מוצג אוטומטית בדפדפן שלך, לחץ על הכפתור למטה:</p>
        <a href="document.pdf" target="_blank">📄 פתח את קובץ ה-PDF</a>
      </div>
    </iframe>
  </div>
</body>
</html>
